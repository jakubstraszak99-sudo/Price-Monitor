spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: 4
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    auth: true
    properties:
      mail:
        smtp:
          starttls:
            enable: true

app:
  mail:
    from: "Price Monitor <${MAIL_USERNAME}>"
  jwt:
    secret: ${JWT_SECRET}
    verification-expiration-ms: 10800000
    access-expiration-ms: 1800000
    refresh-expiration-ms: 2592000000
  paths:
    access-token: /
    refresh-token: /api/v1/auth/refresh
    verification: /verify
    password-reset: /reset-password
    token-query-param: token
  cookie:
    access-token: accessToken
    refresh-token: refreshToken
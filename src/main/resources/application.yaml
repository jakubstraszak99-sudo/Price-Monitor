spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: ${PM_KAFKA_CONCURRENCY:4}
  mail:
    host: ${PM_MAIL_HOST:smtp.gmail.com}
    port: ${PM_MAIL_PORT:587}
    username: ${PM_MAIL_USERNAME}
    password: ${PM_MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true

app:
  mail:
    from: "Price Monitor <${PM_MAIL_USERNAME}>"
  jwt:
    verification-expiration-ms: 10800000
    access-expiration-ms: 1800000
    refresh-expiration-ms: 2592000000
  paths:
    access-token: /
    refresh-token: /api/v1/auth/refresh
    verification: /verify
    password-reset: /reset-password
    token-query-param: token
  cookie:
    access-token: accessToken
    refresh-token: refreshToken
    secure: false

server:
  port: ${PM_SERVER_PORT:8080}

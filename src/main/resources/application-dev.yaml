spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pricemonitordb
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379

logging:
  level:
    org.apache.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    com.github.pricemonitor: DEBUG

app:
  client-url: http://localhost:4200